<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAT 91 Limited – Launching soon</title>
<meta name="description" content="LAT 91 Limited is a NZ supply, sales and information company active in shipping and logistics, property development and high-end tourism ventures.">
<meta name="theme-color" content="#002659">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/figtree-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<main id="main">
  <h1 class="visually-hidden">LAT 91 Limited</h1>
  <section class="hero" id="services" aria-label="Our services">
  <header class="site-header">
    <div class="logo-panel">
      <img src="/assets/img/lat91-logo.svg" alt="LAT 91 Limited" width="470" height="104">
    </div>
  </header>
      <ul class="panels" aria-label="Our services">
        <li>
          <div class="panel panel--shipping">
            <img src="/assets/img/home-shipping.jpg" alt="KIWI car-carrier ship sailing past a bush-covered headland beneath snow-capped mountains" loading="eager" decoding="async">
            <h2 class="panel__label">Shipping</h2>
          </div>
        </li>
        <li>
          <div class="panel panel--tourism">
            <img src="/assets/img/home-tourism.jpg" alt="Golf course fairways above a coastal bay, with a snow-capped volcano on the horizon" loading="eager" decoding="async">
            <h2 class="panel__label">Tourism</h2>
          </div>
        </li>
        <li>
          <div class="panel panel--property">
            <img src="/assets/img/home-property.jpg" alt="Aerial view of leafy Auckland suburbs with the city skyline and Sky Tower beyond" loading="eager" decoding="async">
            <h2 class="panel__label">Property</h2>
          </div>
        </li>
      </ul>
  </section>
  <section class="intro" aria-label="Launching soon">
    <img class="intro__compass" src="/assets/img/compass.svg" alt="" aria-hidden="true" width="486" height="496">
    <p class="intro__soon">LAUNCHING SOON!</p>
  </section>
</main>
  <footer class="site-footer">
    <div class="footer-email">
      <a href="mailto:peter@lat91.co.nz">peter@lat91.co.nz</a>
    </div>
    <hr class="footer-rule">
  </footer>
</body>
</html>
